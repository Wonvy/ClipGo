<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; media-src http://127.0.0.1:*; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>ClipGo · 视频号</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h6l2 3h10v12H3V7Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7V5Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></symbol>
  </svg>
  <header class="app-header">
    <div class="brand"><span class="brand-mark"><svg><use href="#i-download"/></svg></span><span>ClipGo</span></div>
    <div class="header-actions">
      <label class="search-box"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索视频" aria-label="搜索标题或作者" autocomplete="off"><button id="clear-search" class="icon-button" type="button" aria-label="清空搜索" hidden><svg><use href="#i-close"/></svg></button></label>
      <button id="refresh" class="button primary"><svg><use href="#i-refresh"/></svg><span>刷新</span></button>
      <button id="settings-trigger" class="icon-button settings-trigger" aria-label="设置" aria-expanded="false" aria-controls="settings-menu"><svg><use href="#i-settings"/></svg></button>
      <section id="settings-menu" class="popover settings-menu" aria-label="设置" hidden>
        <div class="menu-label">显示视频</div><div class="filters"><button id="filter-recognized" class="filter active" aria-pressed="true">已识别 <span>0</span></button><button id="filter-all" class="filter" aria-pressed="false">全部 <span>0</span></button></div>
        <div class="menu-separator"></div><div class="menu-label">保存位置</div><p id="folder-path" class="folder-path"></p><div class="folder-actions"><button id="choose-folder" class="footer-link">更改位置</button><button id="open-folder" class="footer-link">打开文件夹<svg><use href="#i-folder"/></svg></button></div>
        <p class="shortcut-hint">点击卡片播放 · 空格播放 / 暂停</p>
      </section>
    </div>
  </header>
  <main class="workspace">
    <div class="library-toolbar">
      <div class="library-source"><span>视频列表</span><span id="video-count" class="count-pill">0</span></div>
      <div class="sync-controls"><div class="scan-status" id="scan-status" role="status"><span class="status-dot"></span><span id="scan-message">正在连接…</span></div><button id="auto-refresh" class="auto-refresh" role="switch" aria-checked="true" title="自动读取微信中新加载的视频"><span class="switch-track"></span>自动同步</button><button id="clear-library" class="clear-library" title="清空全部列表记录，保留已下载文件"><svg><use href="#i-trash"/></svg>清空</button></div>
    </div>
    <div id="error-banner" class="error-banner" role="alert" hidden></div>
    <section id="video-grid" class="video-grid" aria-label="视频列表"></section>
    <section id="empty-state" class="empty-state">
      <div class="empty-illustration"><span class="empty-tile tile-back"></span><span class="empty-tile tile-front"><svg><use href="#i-play"/></svg></span><span class="empty-spark">+</span></div>
      <h2 id="empty-title">先在微信里播放一条视频</h2>
      <p id="empty-message">视频加载后会自动出现在这里。</p>
      <button id="empty-refresh" class="button secondary"><svg><use href="#i-refresh"/></svg>立即刷新</button>
    </section>
  </main>
  <aside id="download-panel" class="download-panel" aria-label="下载进度" hidden>
    <div class="download-icon"><svg id="download-symbol"><use href="#i-download"/></svg></div>
    <div class="download-content"><div class="download-top"><strong id="download-state">正在下载</strong><span id="download-title"></span><span id="download-amount"></span></div><progress id="download-progress" max="100" value="0" aria-label="下载进度"></progress><p id="download-message"></p></div>
    <button id="cancel-download" class="button text-button">取消</button>
    <button id="open-download" class="button secondary" hidden>打开视频</button>
  </aside>
  <dialog id="details-dialog" aria-labelledby="details-title"><button id="close-details" class="dialog-close icon-button" aria-label="关闭播放"><svg><use href="#i-close"/></svg></button><div class="details-layout"><div class="detail-cover"><img id="detail-image" alt="视频封面"><video id="preview-video" controls playsinline preload="metadata" hidden></video><div id="preview-loading" class="preview-loading"><span class="preview-spinner"></span><span id="preview-message">正在准备播放…</span><progress id="preview-progress" max="100" value="0"></progress><button id="preview-retry" class="button secondary" hidden>重试</button></div><span id="detail-placeholder" hidden><svg><use href="#i-image"/></svg>暂无封面</span><span id="detail-duration" class="duration-badge" hidden></span></div><div class="details-text"><h2 id="details-title"></h2><p id="details-author"></p><span class="shortcut-hint">空格播放 / 暂停</span><button id="details-action" class="button primary"><svg><use href="#i-download"/></svg><span>下载视频</span></button></div></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="clear-dialog" class="clear-dialog" aria-labelledby="clear-title" aria-describedby="clear-description"><h2 id="clear-title">清空视频列表？</h2><p id="clear-description"></p><p>仅移除列表记录，已下载的文件会保留。</p><div class="clear-dialog-actions"><button id="cancel-clear" class="button secondary cancel-clear" autofocus>取消</button><button id="confirm-clear" class="button danger-button">清空全部</button></div></dialog>
  <template id="video-card-template"><article class="video-card" tabindex="0"><div class="cover-wrap"><button class="cover-action" type="button" aria-label="播放视频"><img class="cover-backdrop" alt="" aria-hidden="true"><img class="cover-image" data-cover alt="视频封面" decoding="async"><span class="cover-placeholder"><svg><use href="#i-image"/></svg><span>加载封面</span></span><span class="cover-play"><svg><use href="#i-play"/></svg></span></button><span class="saved-badge" hidden><svg><use href="#i-check"/></svg>已保存</span><span class="new-badge" hidden>新</span><button class="card-remove icon-button" type="button" aria-label="从列表删除" title="从列表删除，保留已下载文件"><svg><use href="#i-trash"/></svg></button><span class="duration-badge"></span></div><div class="card-info"><button class="card-title" type="button"></button><div class="card-bottom"><span class="card-author"></span><button class="card-download"><svg><use href="#i-download"/></svg><span>下载</span></button></div><p class="card-error" hidden>下载未完成，点击重试</p></div></article></template>
</body>
</html>

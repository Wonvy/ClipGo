<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0f0f12;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
.wrap{display:flex;gap:28px;padding:36px 40px;}
.card{width:360px}
.thumb{position:relative;height:203px;border-radius:12px;overflow:hidden}
.t1{background:radial-gradient(circle at 30% 35%,#ffb36b,transparent 45%),radial-gradient(circle at 75% 70%,#5b8cff,transparent 50%),linear-gradient(135deg,#2b2350,#151527)}
.t2{background:radial-gradient(circle at 70% 30%,#42d6a4,transparent 45%),radial-gradient(circle at 25% 75%,#f06292,transparent 50%),linear-gradient(135deg,#1d3443,#121820)}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:2px 6px;border-radius:4px}
.btn{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 8px;border-radius:999px;font:600 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#fff;background:linear-gradient(135deg,#e8364f,#8b5cf6);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.btn.busy{background:rgba(20,20,24,.85)}
.btn svg{width:14px;height:14px}
.cursor{position:absolute;left:70px;top:22px;width:18px}
.title{color:#f1f1f1;font-weight:600;margin:12px 2px 4px}
.meta{color:#9a9aa3;font-size:12px;margin:0 2px}
.bar{height:10px;border-radius:5px;background:#26262c;margin:8px 2px 0;width:70%}
</style></head><body><div class="wrap">
<div class="card"><div class="thumb t1"><span class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>MP4</span>
<svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1 3.8 7.5-2.6 1.3-3.8-7.6L5 19z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg><span class="dur">12:48</span></div>
<div class="bar"></div><div class="bar" style="width:45%"></div></div>
<div class="card"><div class="thumb t2"><span class="btn busy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>45%</span><span class="dur">03:21</span></div>
<div class="bar"></div><div class="bar" style="width:45%"></div></div>
</div></body></html>
